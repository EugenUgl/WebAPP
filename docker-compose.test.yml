services:
  gateway-tests:
    build:
      context: .
      dockerfile: gateway/Dockerfile.test
    container_name: microservice-gateway-tests
    restart: "no"

  auth-tests:
    build:
      context: .
      dockerfile: flask-auth-service/Dockerfile.test
    container_name: microservice-auth-tests
    restart: "no"

  frontend-tests:
    build:
      context: .
      dockerfile: frontend-service/Dockerfile.test
    container_name: microservice-frontend-tests
    restart: "no"